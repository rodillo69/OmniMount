<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!-- Sin red en el renderer: todo el contenido es local y las llamadas
         salen por IPC al proceso principal. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>OmniMount</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />
  </head>

  <body>
    <div id="app">
      <header class="titlebar">
        <div class="titlebar__brand">
          <span id="titlebar-brand" class="titlebar__brand-mark"></span>
        </div>
        <div class="titlebar__spacer"></div>
        <div id="titlebar-status" class="titlebar__status"></div>
        <div id="titlebar-controls" class="wincontrols"></div>
      </header>

      <div class="shell">
        <nav class="sidebar">
          <div class="sidebar__head">
            <span id="sidebar-brand" class="sidebar__brand-mark"></span>
          </div>
          <div id="sidebar-nav" class="sidebar__nav"></div>
          <div id="sidebar-foot" class="sidebar__foot"></div>
        </nav>

        <main class="main">
          <div id="view" class="view"></div>
        </main>
      </div>
    </div>

    <!-- Orden importante: utilidades, componentes, vistas y por último el
         arranque. Son scripts clásicos porque Chromium no carga módulos ES
         sobre file://. -->
    <script src="js/lib/i18n.js"></script>
    <script src="js/lib/dom.js"></script>
    <script src="js/lib/brand.js"></script>
    <script src="js/lib/format.js"></script>
    <script src="js/lib/icons.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/setup.js"></script>
    <script src="js/components/elevation.js"></script>
    <script src="js/components/backend-fields.js"></script>
    <script src="js/components/drive-form.js"></script>
    <script src="js/components/update-notice.js"></script>
    <script src="js/app.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/explorer.js"></script>
    <script src="js/views/logs.js"></script>
    <script src="js/views/settings.js"></script>
  </body>
</html>
